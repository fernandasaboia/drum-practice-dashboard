<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Drum Practice Book</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@300;400;500;600&display=swap" rel="stylesheet">
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <style>
    :root {
      --bg: #0a0a0f;
      --surface: #13131a;
      --surface2: #1c1c26;
      --border: #2a2a3a;
      --accent: #ff6b35;
      --green: #2d9e6b;
      --yellow: #f0a500;
      --red: #e84040;
      --blue: #4a9eff;
      --text: #f0f0f5;
      --muted: #6b6b80;
      --font-display: 'Bebas Neue', sans-serif;
      --font-body: 'DM Sans', sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: var(--font-body);
      min-height: 100vh;
    }

    header {
      border-bottom: 1px solid var(--border);
      padding: 0 40px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      height: 64px;
      position: sticky;
      top: 0;
      background: rgba(10,10,15,0.95);
      backdrop-filter: blur(12px);
      z-index: 100;
    }

    .logo { font-family: var(--font-display); font-size: 28px; letter-spacing: 2px; color: var(--accent); }
    .logo span { color: var(--text); }
    .header-stats { display: flex; gap: 32px; }
    .header-stat { text-align: center; }
    .header-stat-value { font-family: var(--font-display); font-size: 22px; color: var(--accent); line-height: 1; }
    .header-stat-label { font-size: 10px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; margin-top: 2px; }

    main { max-width: 1200px; margin: 0 auto; padding: 0 40px 40px; }

    .tab-row {
      display: flex;
      border-bottom: 1px solid var(--border);
      margin-bottom: 32px;
      position: sticky;
      top: 64px;
      background: var(--bg);
      z-index: 99;
      padding-top: 20px;
    }

    .tab {
      padding: 10px 24px;
      font-size: 13px;
      font-weight: 600;
      color: var(--muted);
      cursor: pointer;
      border-bottom: 2px solid transparent;
      margin-bottom: -1px;
      text-transform: uppercase;
      letter-spacing: 1px;
      transition: all 0.15s;
    }

    .tab:hover { color: var(--text); }
    .tab.active.skills { color: var(--blue); border-bottom-color: var(--blue); }
    .tab.active.warmups { color: var(--yellow); border-bottom-color: var(--yellow); }
    .tab.disabled { color: #2a2a3a; cursor: default; }
    .tab.disabled:hover { color: #2a2a3a; }

    .filter-bar { display: flex; gap: 12px; margin-bottom: 24px; flex-wrap: wrap; align-items: center; }
    .filter-label { font-size: 11px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); }

    .filter-chip {
      padding: 5px 14px;
      border-radius: 20px;
      border: 1px solid var(--border);
      background: var(--surface);
      color: var(--muted);
      font-size: 12px;
      cursor: pointer;
      transition: all 0.15s;
      font-family: var(--font-body);
    }

    .filter-chip:hover { border-color: var(--muted); color: var(--text); }
    .filter-chip.active { border-color: var(--accent); color: var(--accent); background: rgba(255,107,53,0.08); }

    .practice-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 16px; }

    .practice-card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 20px;
      transition: all 0.2s;
      cursor: pointer;
      position: relative;
      overflow: hidden;
    }

    .practice-card:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,0,0,0.3); }

    .practice-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; }
    .practice-card.skill::before { background: var(--blue); }
    .practice-card.warmup::before { background: var(--yellow); }

    .card-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 14px; gap: 12px; }
    .card-title { font-size: 15px; font-weight: 600; color: var(--text); line-height: 1.3; }
    .card-title a { color: inherit; text-decoration: none; }
    .card-title a:hover { color: var(--accent); }
    .card-subtitle { font-size: 12px; color: var(--muted); margin-top: 3px; }

    .last-practiced { font-size: 11px; padding: 3px 10px; border-radius: 12px; white-space: nowrap; flex-shrink: 0; }
    .last-practiced.fresh { background: rgba(45,158,107,0.15); color: var(--green); }
    .last-practiced.stale { background: rgba(240,165,0,0.15); color: var(--yellow); }
    .last-practiced.overdue { background: rgba(232,64,64,0.15); color: var(--red); }
    .last-practiced.never { background: rgba(107,107,128,0.15); color: var(--muted); }

    .bpm-section { display: flex; align-items: center; gap: 12px; margin-bottom: 14px; }

    .bpm-value { font-family: var(--font-display); font-size: 40px; line-height: 1; }
    .bpm-value.green { color: var(--green); }
    .bpm-value.yellow { color: var(--yellow); }
    .bpm-value.red { color: var(--red); }
    .bpm-value.plain { color: var(--text); }
    .bpm-value.none { color: var(--muted); }

    .bpm-unit { font-size: 11px; color: var(--muted); text-transform: uppercase; letter-spacing: 1px; }
    .bpm-meta { font-size: 12px; color: var(--muted); line-height: 1.6; }
    .bpm-meta strong { color: var(--text); }

    .progress-wrap { margin-bottom: 14px; }
    .progress-label { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); margin-bottom: 5px; }
    .progress-bar { height: 4px; background: var(--border); border-radius: 2px; overflow: hidden; }
    .progress-fill { height: 100%; border-radius: 2px; transition: width 0.5s ease; }
    .progress-fill.green { background: var(--green); }
    .progress-fill.yellow { background: var(--yellow); }
    .progress-fill.red { background: var(--red); }

    .history-wrap { margin-bottom: 14px; }
    .history-label { display: flex; justify-content: space-between; font-size: 11px; color: var(--muted); margin-bottom: 4px; }
    .history-graph-container { position: relative; }
    .history-graph { width: 100%; height: 48px; display: block; }
    .history-dates { display: flex; justify-content: space-between; font-size: 10px; color: var(--muted); margin-top: 3px; opacity: 0.7; }

    .card-skills { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 14px; }
    .skill-tag { font-size: 11px; padding: 3px 10px; border-radius: 12px; background: var(--surface2); color: var(--muted); border: 1px solid var(--border); }

    .card-notes { font-size: 12px; color: var(--muted); line-height: 1.5; font-style: italic; border-top: 1px solid var(--border); padding-top: 12px; }

    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.7); z-index: 1000; display: flex; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: opacity 0.2s; }
    .modal-overlay.open { opacity: 1; pointer-events: all; }

    .modal { background: var(--surface); border: 1px solid var(--border); border-radius: 16px; padding: 32px; width: 600px; max-width: 90vw; max-height: 90vh; overflow-y: auto; }

    .modal-header { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: 24px; }
    .modal-title { font-family: var(--font-display); font-size: 24px; color: var(--accent); letter-spacing: 1px; }
    .modal-subtitle { font-size: 13px; color: var(--muted); margin-top: 4px; }
    .modal-close { background: none; border: none; color: var(--muted); font-size: 20px; cursor: pointer; padding: 0; line-height: 1; }
    .modal-close:hover { color: var(--text); }

    .chart-container { position: relative; height: 250px; margin-bottom: 24px; }

    .editable { background: var(--surface2); border: 1px solid var(--border); border-radius: 6px; padding: 6px 10px; color: var(--text); font-family: var(--font-body); font-size: 13px; width: 100%; transition: border-color 0.15s; }
    .editable:focus { outline: none; border-color: var(--accent); }

    .modal-fields { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; margin-bottom: 20px; }
    .modal-field label { display: block; font-size: 10px; text-transform: uppercase; letter-spacing: 1px; color: var(--muted); margin-bottom: 5px; }

    .save-btn { padding: 10px 24px; background: var(--accent); color: white; border: none; border-radius: 8px; font-size: 14px; font-weight: 600; cursor: pointer; font-family: var(--font-body); transition: opacity 0.15s; }
    .save-btn:hover { opacity: 0.85; }

    .empty-state { text-align: center; padding: 80px 20px; }
    .empty-state-icon { font-size: 64px; margin-bottom: 16px; }
    .empty-state h2 { font-family: var(--font-display); font-size: 32px; letter-spacing: 2px; color: var(--muted); margin-bottom: 8px; }
    .empty-state p { color: var(--muted); font-size: 14px; }

    .loading { text-align: center; padding: 80px; color: var(--muted); font-family: var(--font-display); font-size: 24px; letter-spacing: 3px; animation: pulse 1.5s infinite; }

    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
  </style>
</head>
<body>

<header>
  <div class="logo">Drum<span>Book</span></div>
  <div class="header-stats">
    <div class="header-stat">
      <div class="header-stat-value" id="stat-skills">—</div>
      <div class="header-stat-label">Exercises</div>
    </div>
    <div class="header-stat">
      <div class="header-stat-value" id="stat-warmups">—</div>
      <div class="header-stat-label">Warm Ups</div>
    </div>
    <div class="header-stat">
      <div class="header-stat-value" id="stat-sessions">—</div>
      <div class="header-stat-label">Sessions</div>
    </div>
    <div class="header-stat">
      <div class="header-stat-value" id="stat-due">—</div>
      <div class="header-stat-label">Due for Practice</div>
    </div>
  </div>
</header>

<main>
  <div style="display:flex; justify-content:flex-end; margin-bottom: -24px; position:relative; z-index:98;">
    <span id="last-updated" style="font-size:10px; color:#3a3a4a; letter-spacing:0.5px;"></span>
  </div>
  <div class="tab-row">
    <div class="tab active skills" data-tab="skills">Exercises</div>
    <div class="tab warmups" data-tab="warmups">Warm Ups</div>
    <div class="tab disabled">Songs (coming soon)</div>
  </div>

  <div class="filter-bar" id="filter-bar">
    <span class="filter-label">Filter:</span>
    <div class="filter-chip active" data-skill="all">All</div>
  </div>

  <div id="practices-container"><div class="loading">LOADING...</div></div>
</main>

<div class="modal-overlay" id="modal-overlay">
  <div class="modal">
    <div class="modal-header">
      <div>
        <div class="modal-title" id="modal-title"></div>
        <div class="modal-subtitle" id="modal-subtitle"></div>
      </div>
      <button class="modal-close" id="modal-close">✕</button>
    </div>
    <div class="chart-container">
      <canvas id="bpm-chart"></canvas>
    </div>
    <div class="modal-fields">
      <div class="modal-field" id="modal-goal-field">
        <label>Goal BPM</label>
        <input type="number" class="editable" id="edit-goal-bpm" placeholder="e.g. 120" />
      </div>
      <div class="modal-field">
        <label>Notes</label>
        <input type="text" class="editable" id="edit-notes" placeholder="Add notes..." />
      </div>
    </div>
    <button class="save-btn" id="modal-save">Save Changes</button>
  </div>
</div>

<script>
  const SUPABASE_URL = 'https://diqfnsslthcnmcirqjqi.supabase.co';
  const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRpcWZuc3NsdGhjbm1jaXJxanFpIiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzEzNjYwMjUsImV4cCI6MjA4Njk0MjAyNX0.RBPriP0CeChu-qB5jf4SbqwyS9dh4CsyUs6beaqk0CE';

  let allPractices = [];
  let allSessions = [];
  let allSkills = [];
  let practiceSkills = [];
  let activeTab = 'skills';
  let activeSkillFilter = 'all';
  let currentPractice = null;
  let bpmChart = null;

  async function supabaseFetch(path) {
    const res = await fetch(SUPABASE_URL + '/rest/v1/' + path, {
      headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': 'Bearer ' + SUPABASE_ANON_KEY }
    });
    const text = await res.text();
    return text ? JSON.parse(text) : [];
  }

  async function supabaseUpdate(table, id, data) {
    await fetch(SUPABASE_URL + '/rest/v1/' + table + '?id=eq.' + id, {
      method: 'PATCH',
      headers: { 'apikey': SUPABASE_ANON_KEY, 'Authorization': 'Bearer ' + SUPABASE_ANON_KEY, 'Content-Type': 'application/json', 'Prefer': 'return=minimal' },
      body: JSON.stringify(data)
    });
  }

  async function loadData() {
    const [practices, sessions, skills, ps] = await Promise.all([
      supabaseFetch('practices?order=created_at.desc'),
      supabaseFetch('sessions?order=practiced_at.asc'),
      supabaseFetch('skills?order=name'),
      supabaseFetch('practice_skills')
    ]);
    allPractices = practices;
    allSessions = sessions;
    allSkills = skills;
    practiceSkills = ps;
    updateStats();
    renderFilters();
    renderPractices();
  }

  function updateStats() {
    document.getElementById('stat-skills').textContent = allPractices.filter(p => p.entry_type === 'exercise').length;
    document.getElementById('stat-warmups').textContent = allPractices.filter(p => p.entry_type === 'warmup').length;
    document.getElementById('stat-sessions').textContent = allSessions.length;
    const due = allPractices.filter(p => {
      const last = lastSessionDate(p.id);
      if (!last) return true;
      return (Date.now() - new Date(last)) / (1000 * 60 * 60 * 24) > 14;
    }).length;
    document.getElementById('stat-due').textContent = due;
  }

  function sessionsForPractice(practiceId) {
    return allSessions.filter(s => s.practice_id === practiceId);
  }

  function lastSessionDate(practiceId) {
    const s = sessionsForPractice(practiceId);
    return s.length ? s[s.length - 1].practiced_at : null;
  }

  function firstSessionDate(practiceId) {
    const s = sessionsForPractice(practiceId);
    return s.length ? s[0].practiced_at : null;
  }

  function latestBpm(practiceId) {
    const s = sessionsForPractice(practiceId).filter(x => x.bpm_played);
    return s.length ? s[s.length - 1].bpm_played : null;
  }

  function firstBpm(practiceId) {
    const s = sessionsForPractice(practiceId).filter(x => x.bpm_played);
    return s.length ? s[0].bpm_played : null;
  }

  function bestBpm(practiceId) {
    const s = sessionsForPractice(practiceId).filter(x => x.bpm_played);
    return s.length ? Math.max(...s.map(x => x.bpm_played)) : null;
  }

  function getSkillsForPractice(practiceId) {
    const ids = practiceSkills.filter(ps => ps.practice_id === practiceId).map(ps => ps.skill_id);
    return allSkills.filter(s => ids.includes(s.id));
  }

  function bpmColor(current, goal) {
    if (!current || !goal) return 'none';
    const r = current / goal;
    if (r >= 1) return 'green';
    if (r >= 0.85) return 'yellow';
    return 'red';
  }

  function lastPracticedLabel(practiceId) {
    const date = lastSessionDate(practiceId);
    if (!date) return { text: 'Never', cls: 'never' };
    const days = (Date.now() - new Date(date)) / (1000 * 60 * 60 * 24);
    if (days < 14) return { text: Math.floor(days) + 'd ago', cls: 'fresh' };
    if (days < 30) return { text: Math.floor(days) + 'd ago', cls: 'stale' };
    return { text: Math.floor(days) + 'd ago', cls: 'overdue' };
  }

  function formatDateShort(dateStr) {
    if (!dateStr) return '';
    const d = new Date(dateStr);
    const now = new Date();
    const day = d.getDate();
    const month = d.toLocaleDateString('en-US', { month: 'short' });
    const year = d.getFullYear();
    return year < now.getFullYear() ? day + '-' + month + ' ' + year : day + '-' + month;
  }

  function formatDateFull(dateStr) {
    return new Date(dateStr).toLocaleDateString('en-US', { month: 'short', day: 'numeric' });
  }

  function renderFilters() {
    const bar = document.getElementById('filter-bar');
    bar.innerHTML = '<span class="filter-label">Filter:</span><div class="filter-chip active" data-skill="all">All</div>';
    allSkills.forEach(skill => {
      const chip = document.createElement('div');
      chip.className = 'filter-chip';
      chip.setAttribute('data-skill', skill.id);
      chip.textContent = skill.name;
      bar.appendChild(chip);
    });
    bar.querySelectorAll('.filter-chip').forEach(chip => {
      chip.addEventListener('click', function() {
        bar.querySelectorAll('.filter-chip').forEach(c => c.classList.remove('active'));
        chip.classList.add('active');
        activeSkillFilter = chip.getAttribute('data-skill');
        renderPractices();
      });
    });
  }

  function buildSparkline(practiceId) {
    const sessions = sessionsForPractice(practiceId).filter(s => s.bpm_played);
    const gradId = 'g' + practiceId.replace(/-/g, '');

    if (sessions.length === 0) {
      return '<svg class="history-graph" viewBox="0 0 300 48" preserveAspectRatio="none">' +
        '<line x1="0" y1="24" x2="300" y2="24" stroke="#2a2a3a" stroke-width="1" stroke-dasharray="6,4"/>' +
        '<text x="150" y="30" text-anchor="middle" fill="#3a3a4a" font-size="11" font-family="DM Sans,sans-serif">No data yet</text>' +
        '</svg>';
    }

    const bpms = sessions.map(s => s.bpm_played);
    const minB = Math.min(...bpms), maxB = Math.max(...bpms);
    const range = maxB - minB || 1;
    const W = 300, H = 48, pad = 4;

    const pts = bpms.map((b, i) => {
      const x = sessions.length === 1 ? W / 2 : (i / (sessions.length - 1)) * W;
      const y = pad + (1 - (b - minB) / range) * (H - pad * 2);
      return [Math.round(x * 10) / 10, Math.round(y * 10) / 10];
    });

    const polyline = pts.map(p => p[0] + ',' + p[1]).join(' ');
    const last = pts[pts.length - 1];
    const fill = 'M' + pts[0][0] + ',' + pts[0][1] + ' ' + pts.map(p => 'L' + p[0] + ',' + p[1]).join(' ') + ' L' + last[0] + ',' + H + ' L' + pts[0][0] + ',' + H + ' Z';

    return '<svg class="history-graph" viewBox="0 0 ' + W + ' ' + H + '" preserveAspectRatio="none">' +
      '<defs><linearGradient id="' + gradId + '" x1="0" y1="0" x2="0" y2="1">' +
        '<stop offset="0%" stop-color="#f0a500" stop-opacity="0.25"/>' +
        '<stop offset="100%" stop-color="#f0a500" stop-opacity="0"/>' +
      '</linearGradient></defs>' +
      '<path d="' + fill + '" fill="url(#' + gradId + ')"/>' +
      '<polyline points="' + polyline + '" fill="none" stroke="#f0a500" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>' +
      '<circle cx="' + last[0] + '" cy="' + last[1] + '" r="3.5" fill="#f0a500"/>' +
      '</svg>';
  }

  function renderPractices() {
    const container = document.getElementById('practices-container');
    const entryType = activeTab === 'skills' ? 'exercise' : 'warmup';
    let practices = allPractices.filter(p => p.entry_type === entryType);

    if (activeSkillFilter !== 'all') {
      const matchingIds = practiceSkills.filter(ps => ps.skill_id === activeSkillFilter).map(ps => ps.practice_id);
      practices = practices.filter(p => matchingIds.includes(p.id));
    }

    if (!practices.length) {
      container.innerHTML =
        '<div class="empty-state">' +
          '<div class="empty-state-icon">' + (activeTab === 'skills' ? '🎯' : '🥁') + '</div>' +
          '<h2>NO ' + activeTab.toUpperCase() + ' YET</h2>' +
          '<p>Open a Drumeo assignment and click "Add to Practice Book"</p>' +
        '</div>';
      return;
    }

    container.innerHTML = '';
    const grid = document.createElement('div');
    grid.className = 'practice-grid';

    practices.forEach(practice => {
      const card = document.createElement('div');
      const isWarmup = practice.entry_type !== 'exercise';
      card.className = 'practice-card ' + (isWarmup ? 'warmup' : 'skill');

      const current = latestBpm(practice.id);
      const goal = practice.goal_bpm;
      const color = isWarmup ? 'plain' : bpmColor(current, goal);
      const lp = lastPracticedLabel(practice.id);
      const skills = getSkillsForPractice(practice.id);

      let bpmHtml = '';

      if (isWarmup) {
        const first = firstBpm(practice.id);
        const best = bestBpm(practice.id);
        const sessionCount = sessionsForPractice(practice.id).filter(s => s.bpm_played).length;
        const firstDate = formatDateShort(firstSessionDate(practice.id));
        const lastDate = formatDateShort(lastSessionDate(practice.id));

        bpmHtml =
          '<div class="bpm-section">' +
            '<div>' +
              '<div class="bpm-value ' + (current ? 'plain' : 'none') + '">' + (current || '—') + '</div>' +
              '<div class="bpm-unit">BPM</div>' +
            '</div>' +
            (first
              ? '<div class="bpm-meta">Started: <strong>' + first + '</strong><br>Best: <strong>' + best + '</strong></div>'
              : '<div class="bpm-meta" style="color:var(--muted)">No sessions yet</div>') +
          '</div>' +
          '<div class="history-wrap">' +
            '<div class="history-label"><span>Session history</span><span>' + sessionCount + ' session' + (sessionCount !== 1 ? 's' : '') + '</span></div>' +
            '<div class="history-graph-container">' +
              buildSparkline(practice.id) +
              (sessionCount > 0
                ? '<div class="history-dates"><span>' + firstDate + '</span><span>' + lastDate + '</span></div>'
                : '') +
            '</div>' +
          '</div>';
      } else {
        const pct = (current && goal) ? Math.min(100, Math.round((current / goal) * 100)) : 0;
        bpmHtml =
          '<div class="bpm-section">' +
            '<div>' +
              '<div class="bpm-value ' + color + '">' + (current || '—') + '</div>' +
              '<div class="bpm-unit">BPM</div>' +
            '</div>' +
            (goal ? '<div class="bpm-meta">Goal: <strong>' + goal + '</strong>' + (current >= goal ? ' ✓' : '') + '</div>' : '') +
          '</div>' +
          (goal && current
            ? '<div class="progress-wrap">' +
                '<div class="progress-label"><span>Progress to goal</span><span>' + pct + '%</span></div>' +
                '<div class="progress-bar"><div class="progress-fill ' + color + '" style="width:' + pct + '%"></div></div>' +
              '</div>'
            : '');
      }

      card.innerHTML =
        '<div class="card-header">' +
          '<div>' +
            '<div class="card-title"><a href="' + practice.class_url + '" target="_blank">' + practice.practice_name + '</a></div>' +
            '<div class="card-subtitle">' + practice.class_name + ' — ' + practice.assignment_name + '</div>' +
          '</div>' +
          '<div class="last-practiced ' + lp.cls + '">' + lp.text + '</div>' +
        '</div>' +
        bpmHtml +
        (skills.length ? '<div class="card-skills">' + skills.map(s => '<div class="skill-tag">' + s.name + '</div>').join('') + '</div>' : '') +
        (practice.notes ? '<div class="card-notes">' + practice.notes + '</div>' : '');

      card.addEventListener('click', function(e) {
        if (e.target.tagName === 'A') return;
        openModal(practice);
      });

      grid.appendChild(card);
    });

    container.appendChild(grid);
  }

  function openModal(practice) {
    currentPractice = practice;
    const isWarmup = practice.entry_type !== 'exercise';
    const sessions = allSessions.filter(s => s.practice_id === practice.id && s.bpm_played);

    document.getElementById('modal-title').textContent = practice.practice_name;
    document.getElementById('modal-subtitle').textContent = practice.class_name + ' — ' + practice.assignment_name;
    document.getElementById('edit-goal-bpm').value = practice.goal_bpm || '';
    document.getElementById('edit-notes').value = practice.notes || '';
    document.getElementById('modal-goal-field').style.display = isWarmup ? 'none' : '';

    if (bpmChart) bpmChart.destroy();
    const ctx = document.getElementById('bpm-chart').getContext('2d');

    if (sessions.length === 0) {
      ctx.clearRect(0, 0, 600, 250);
      ctx.fillStyle = '#6b6b80';
      ctx.font = '14px DM Sans';
      ctx.textAlign = 'center';
      ctx.fillText('No session data yet', 300, 125);
    } else {
      const lineColor = isWarmup ? '#f0a500' : '#ff6b35';
      bpmChart = new Chart(ctx, {
        type: 'line',
        data: {
          labels: sessions.map(s => formatDateFull(s.practiced_at)),
          datasets: [
            {
              label: 'BPM',
              data: sessions.map(s => s.bpm_played),
              borderColor: lineColor,
              backgroundColor: lineColor + '1a',
              borderWidth: 2,
              pointBackgroundColor: lineColor,
              pointRadius: 4,
              tension: 0.3,
              fill: true
            },
            ...(!isWarmup && practice.goal_bpm ? [{
              label: 'Goal',
              data: sessions.map(() => practice.goal_bpm),
              borderColor: '#2d9e6b',
              borderWidth: 1,
              borderDash: [6, 4],
              pointRadius: 0,
              fill: false
            }] : [])
          ]
        },
        options: {
          responsive: true,
          maintainAspectRatio: false,
          plugins: { legend: { labels: { color: '#6b6b80', font: { family: 'DM Sans' } } } },
          scales: {
            x: { ticks: { color: '#6b6b80' }, grid: { color: '#2a2a3a' } },
            y: { ticks: { color: '#6b6b80' }, grid: { color: '#2a2a3a' }, beginAtZero: false }
          }
        }
      });
    }

    document.getElementById('modal-overlay').classList.add('open');
  }

  document.querySelectorAll('.tab[data-tab]').forEach(tab => {
    tab.addEventListener('click', function() {
      document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
      tab.classList.add('active');
      activeTab = tab.getAttribute('data-tab');
      renderPractices();
    });
  });

  document.getElementById('modal-close').addEventListener('click', function() {
    document.getElementById('modal-overlay').classList.remove('open');
  });

  document.getElementById('modal-overlay').addEventListener('click', function(e) {
    if (e.target === this) this.classList.remove('open');
  });

  document.getElementById('modal-save').addEventListener('click', async function() {
    if (!currentPractice) return;
    const goalBpm = parseInt(document.getElementById('edit-goal-bpm').value) || null;
    const notes = document.getElementById('edit-notes').value.trim() || null;
    const updateData = { notes };
    if (currentPractice.entry_type !== 'warmup') updateData.goal_bpm = goalBpm;
    await supabaseUpdate('practices', currentPractice.id, updateData);
    currentPractice.goal_bpm = goalBpm;
    currentPractice.notes = notes;
    document.getElementById('modal-overlay').classList.remove('open');
    renderPractices();
    updateStats();
  });

  function updateTimestamp() {
    const now = new Date();
    const time = now.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });
    const el = document.getElementById('last-updated');
    if (el) el.textContent = 'Last updated: ' + time;
  }

  async function loadAndRefresh() {
    await loadData();
    updateTimestamp();
  }

  loadAndRefresh();
  setInterval(loadAndRefresh, 15000);
</script>
</body>
</html>
